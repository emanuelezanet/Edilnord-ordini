<style>
  /* Stessi colori e caratteri dell'app dei buoni di carico */
  :root{
    --bg-shell:#1C1F22; --bg-paper:#EDEAE2; --card:#FBF9F5;
    --accent:#E8A33D; --accent-dark:#C6822A; --stamp:#B23B3B; --success:#4C7A52; --info:#3E6A8A;
    --warn-bg:#FFF1D6; --bad-bg:#F8E4E1; --ok-bg:#E6EFE6;
    --text:#26292B; --muted:#767A7C; --border:#DBD5C8;
    --font-display:'Archivo Black', sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{margin:0;padding:0;height:100%;background:var(--bg-shell);}
  body{margin:0;min-height:100%;font-family:var(--font-body);background:var(--bg-paper);color:var(--text);font-size:16px;-webkit-tap-highlight-color:transparent;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:16px;}
  [hidden]{display:none !important;}

  /* ---------- Barra in alto: identica all'app dei buoni (v20) ---------- */
  .topbar{background:var(--bg-shell);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.25);flex-wrap:wrap;row-gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{height:24px;width:auto;flex:none;display:block;}
  .brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:1.5px;font-weight:600;padding-left:12px;border-left:1px solid rgba(255,255,255,0.2);}
  .tabs{display:flex;gap:6px;}
  .tab{background:transparent;border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.75);padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;text-decoration:none;cursor:pointer;}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#20221f;cursor:default;}
  .tab .short{display:none;}
  @media(max-width:560px){
    .topbar{justify-content:flex-start;}
    .tabs{width:100%;}
    .tab{flex:1;font-size:12px;padding:9px 4px;}
    .tab .long{display:none;} .tab .short{display:inline;}
  }
  .badge{background:var(--stamp);color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:10px;min-width:16px;text-align:center;}
  .tab.active .badge{background:rgba(0,0,0,0.25);color:#fff;}
  .badge.zero{display:none;}
  .badge.flash{animation:flash 0.6s ease-in-out 2;}
  @keyframes flash{0%,100%{transform:scale(1);}50%{transform:scale(1.35);background:var(--accent-dark);}}
  .opbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;font-size:14px;}
  .opbar .who{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .opbar .ver{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:auto;}
  .opbar button{background:transparent;border:1.5px solid var(--border);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text);min-height:36px;}
  .opbar .missing{color:var(--stamp);font-weight:700;}
  .opform{display:flex;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--border);}
  .opform input{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .avviso{position:fixed;top:12px;left:12px;right:12px;z-index:70;background:var(--bg-shell);color:#fff;border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .avviso b{display:block;color:var(--accent);font-size:13px;letter-spacing:.3px;}
  .avviso span{font-size:14px;}
  .avviso button{margin-left:auto;background:var(--accent);color:#20221f;border:none;border-radius:8px;padding:10px 14px;font-weight:700;min-height:44px;}
  .avviso .x{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);margin-left:0;}
  @media(min-width:900px){ .avviso{left:auto;right:24px;max-width:460px;} }
  main{max-width:900px;margin:0 auto;padding:16px 14px 80px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .search{flex:1;min-width:200px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:12px 14px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);}
  .btn{border:none;border-radius:9px;padding:12px 16px;font-size:15px;font-weight:700;min-height:46px;}
  .btn.primary{background:var(--accent);color:#20221f;}
  .btn.dark{background:var(--bg-shell);color:#fff;}
  .btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);}
  .btn.danger{background:transparent;border:1.5px solid var(--stamp);color:var(--stamp);}
  .btn.danger.confirm{background:var(--stamp);color:#fff;}
  .btn:disabled{opacity:.5;}

  .cat-head{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:left;color:var(--text);display:grid;gap:8px;}
  .card.off{opacity:.55;}
  .card-name{font-weight:700;font-size:16px;line-height:1.3;}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .pill{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:12px;background:rgba(0,0,0,.06);color:var(--text);}
  .pill.qty{background:var(--bg-shell);color:#fff;}
  .pill.ore{background:rgba(62,106,138,.14);color:var(--info);}
  .pill.bad{background:var(--stamp);color:#fff;}
  .pill.warn{background:var(--accent);color:#20221f;}
  .pill.todo{background:var(--warn-bg);color:#6B4A0F;}
  .pill.pay{background:#7a1f1f;color:#fff;letter-spacing:.02em;}
  .acc.pay{border-color:#7a1f1f;}
  .accv{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:4px 0;}
  .accv .an{min-width:160px;font-weight:600;}
  .buono-ko{border:1.5px solid var(--stamp);border-radius:8px;padding:10px 12px;margin:8px 0;}

  .empty{background:var(--card);border:1.5px dashed var(--border);border-radius:12px;padding:22px;text-align:center;display:grid;gap:12px;justify-items:center;}
  .empty p{margin:0;color:var(--muted);max-width:52ch;}

  .back{margin-bottom:12px;}
  .sheet{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:grid;gap:18px;}
  .sheet h1{font-family:var(--font-display);font-size:24px;margin:0;line-height:1.15;}
  .sec h2{font-size:13px;font-family:var(--font-mono);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
  .list{margin:0;padding:0;list-style:none;display:grid;gap:6px;}
  .list li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;background:rgba(0,0,0,.03);border-radius:8px;}
  .list .kind{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap;}
  .muted{color:var(--muted);}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}

  .form{display:grid;gap:14px;}
  .row{display:grid;grid-template-columns:2fr 1fr 110px;gap:10px;}
  @media (max-width:620px){ .row{grid-template-columns:1fr;} }
  .field{display:grid;gap:5px;min-width:0;}
  .field label,.lbl{font-size:13px;font-weight:600;color:var(--muted);}
  .inp{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 12px;background:#fff;color:var(--text);}
  .inp:focus{outline:none;border-color:var(--accent-dark);}
  .edit-row{display:grid;grid-template-columns:1fr 150px auto auto auto;gap:6px;align-items:center;}
  .edit-row.two{grid-template-columns:1fr auto;}
  .edit-row.scad{grid-template-columns:1fr 120px 150px auto;}
  @media (max-width:620px){
    .edit-row{grid-template-columns:1fr 1fr;}
    .edit-row .inp:first-child{grid-column:1 / -1;}
    .edit-row.two{grid-template-columns:1fr auto;}
    .edit-row.two .inp:first-child{grid-column:auto;}
    .edit-row.scad{grid-template-columns:1fr 1fr;}
  }
  .sq{width:44px;height:44px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:18px;color:var(--text);}
  .sq.rm{color:var(--stamp);}
  .add-line{background:transparent;border:1.5px dashed var(--border);color:var(--muted);border-radius:8px;padding:10px;font-weight:600;font-size:14px;}

  .manut{display:grid;gap:8px;}
  .manut-item{padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.03);display:grid;gap:3px;}
  .manut-top{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--font-mono);font-size:13px;color:var(--muted);}
  .manut-what{font-weight:600;}
  .box{border:1px solid var(--border);border-radius:10px;padding:14px;display:grid;gap:12px;background:var(--bg-paper);}

  .toast{position:fixed;left:12px;right:12px;bottom:18px;z-index:60;background:var(--bg-shell);color:#fff;border-radius:10px;padding:14px 16px;font-size:15px;font-weight:600;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .toast.err{background:var(--stamp);}
  @media(min-width:900px){ .toast{left:auto;right:24px;max-width:440px;} }

  .login-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg-shell);display:flex;align-items:center;justify-content:center;padding:16px;}
  .login-card{width:100%;max-width:420px;background:var(--card);border-radius:12px;padding:24px 20px;display:grid;gap:14px;}
  .login-card h2{font-family:var(--font-display);margin:0;font-size:22px;}
  .login-card label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--muted);}
  .login-error{background:var(--bad-bg);color:var(--stamp);border-radius:8px;padding:10px 12px;font-size:15px;font-weight:600;}
  .warnbox{background:var(--warn-bg);color:#6B4A0F;border:1px solid #E8C27A;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;margin-bottom:12px;}

  /* ---------- Passo 2: schede, noleggi, calendario ---------- */
  /* sotto-schede dei noleggi: più chiare, per distinguerle dalle 4 schede principali */
  .tabsbar{max-width:900px;margin:12px auto 0;padding:0 14px;display:flex;gap:6px;}
  .tabsbar button{flex:1;max-width:220px;background:var(--card);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:10px 8px;font-size:15px;font-weight:700;min-height:48px;}
  .tabsbar button.active{background:var(--bg-shell);border-color:var(--bg-shell);color:#fff;}
  .bigbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .btn.big{flex:1;min-width:200px;min-height:56px;font-size:17px;}
  .btn.force{background:var(--stamp);color:#fff;}
  .cnt{font-family:var(--font-mono);background:rgba(0,0,0,.08);border-radius:10px;padding:0 7px;margin-left:4px;}
  .small{font-size:14px;margin:0;}
  .nlist{display:grid;gap:8px;}
  .ncard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:left;color:var(--text);display:grid;gap:4px;width:100%;}
  .ncard-top{display:flex;gap:10px;align-items:center;justify-content:space-between;}
  .ncard-cli{font-weight:700;font-size:17px;}
  .ncard-att{font-size:15px;}
  .ncard-when{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);}
  .spill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;color:#fff;background:var(--muted);}
  .s-in_ritardo{background:var(--stamp);} .s-da_consegnare{background:var(--accent);color:#20221f;}
  .s-fuori{background:var(--info);} .s-prenotato{background:var(--bg-shell);} .s-chiuso{background:var(--success);}
  .cal-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .cal-legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;}
  .cal-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;}
  .cal{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;}
  .cal th,.cal td{border-bottom:1px solid var(--border);padding:3px;text-align:center;}
  .cal thead th{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);padding:8px 3px;white-space:nowrap;}
  .cal .cal-name{text-align:left;font-weight:600;padding:6px 8px;position:sticky;left:0;background:var(--card);min-width:170px;max-width:220px;}
  .cal-cat th{text-align:left;font-family:var(--font-mono);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);background:var(--bg-paper);padding:6px 8px;}
  .cal-cell{width:100%;min-width:56px;height:34px;border:1px solid transparent;border-radius:6px;background:transparent;font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--text);}
  .c-part{background:rgba(232,163,61,.35) !important;} .c-full{background:var(--info) !important;color:#fff !important;}
  .c-late{background:var(--stamp) !important;color:#fff !important;}
  .c-today{border-color:var(--accent) !important;} .c-today-h{color:var(--accent-dark) !important;}
  .c-sel{outline:3px solid var(--bg-shell);}
  .nriga{display:grid;gap:4px;}
  .disp{font-size:14px;font-weight:600;min-height:18px;}
  .disp .ok{color:var(--success);} .disp .ko{color:var(--stamp);}
  .voce{border:1px solid var(--border);border-radius:10px;padding:12px;display:grid;gap:12px;background:var(--bg-paper);}
  .voce-head{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;}
  .ctrl{display:grid;gap:6px;}
  .ctrl-t{font-weight:600;}
  .prima{font-weight:600;font-size:13px;color:var(--muted);background:rgba(0,0,0,.06);border-radius:6px;padding:2px 8px;margin-left:8px;white-space:nowrap;}
  .chipv{border:1.5px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:10px 16px;min-height:48px;min-width:64px;font-size:16px;font-weight:600;}
  .chipv.on{background:var(--bg-shell);border-color:var(--bg-shell);color:#fff;}
  .diff{font-size:14px;font-weight:600;color:var(--stamp);}
  .diff:empty{display:none;}
  .accs{display:flex;flex-wrap:wrap;gap:8px;}
  .acc{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:10px 14px;min-height:48px;font-size:15px;}
  .acc input{width:22px;height:22px;}
  .facts{display:flex;flex-wrap:wrap;gap:8px 22px;}
  .facts > div{display:grid;gap:2px;}
  .ctrl-line{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:4px 0;border-bottom:1px dashed var(--border);}
  .ctrl-line.bad{color:var(--stamp);font-weight:600;}
  .segn .list li{background:var(--bad-bg);color:var(--stamp);font-weight:600;}
  /* ---------- Passo 3: foto ---------- */
  .foto-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#fff;padding:0;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb-x{position:absolute;top:4px;right:4px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:15px;}
  .thumb.big{width:150px;height:auto;display:grid;text-align:left;color:var(--text);}
  .thumb.big img{height:110px;}
  .thumb.big span{font-size:11.5px;font-family:var(--font-mono);padding:4px 6px;color:var(--muted);}
  .foto-add{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border:1.5px dashed var(--border);border-radius:8px;background:#fff;font-weight:600;cursor:pointer;}
  .fo-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:12px;}
  .fo-in{max-width:100%;max-height:100%;display:grid;gap:10px;}
  .fo-in img{max-width:100%;max-height:78vh;border-radius:8px;justify-self:center;}
  .fo-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:#fff;font-size:14px;}
  .fo-bar span{flex:1;min-width:200px;}
  .fo-bar .btn{text-decoration:none;display:inline-flex;align-items:center;}
  .fo-bar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4);}
</style>
</head>

function slug(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'attrezzo';
}

// Stato di una scadenza: 'scaduta' | 'vicina' | 'ok' | 'da_impostare' | 'ore_ignote'
// A data: vicina entro 30 giorni. A ore: vicina entro 20 ore dalle ore attuali conosciute.
function statoScadenza(s, oreAttuali, oggi){
  if(s.tipo === 'ore'){
    if(typeof s.ore !== 'number' || !isFinite(s.ore)) return {stato: 'da_impostare', testo: 'da impostare'};
    if(typeof oreAttuali !== 'number') return {stato: 'ore_ignote', testo: 'a ' + s.ore + ' h (ore attuali non note)'};
    const diff = s.ore - oreAttuali;
    if(diff < 0) return {stato: 'scaduta', testo: 'scaduta da ' + fmtN(-diff) + ' h'};
    return {stato: diff <= 20 ? 'vicina' : 'ok', testo: 'tra ' + fmtN(diff) + ' h (a ' + fmtN(s.ore) + ' h)'};
  }
  if(!s.data || !/^\d{4}-\d{2}-\d{2}$/.test(s.data)) return {stato: 'da_impostare', testo: 'da impostare'};
  const t0 = Date.UTC(+oggi.slice(0, 4), +oggi.slice(5, 7) - 1, +oggi.slice(8, 10));
  const t1 = Date.UTC(+s.data.slice(0, 4), +s.data.slice(5, 7) - 1, +s.data.slice(8, 10));
  const giorni = Math.round((t1 - t0) / 86400000);
  if(giorni < 0) return {stato: 'scaduta', testo: 'scaduta il ' + fmtData(s.data)};
  if(giorni === 0) return {stato: 'vicina', testo: 'scade oggi'};
  return {stato: giorni <= 30 ? 'vicina' : 'ok', testo: (giorni <= 30 ? 'tra ' + giorni + (giorni === 1 ? ' giorno' : ' giorni') + ' · ' : '') + fmtData(s.data)};
}
function statoPeggiore(att, oggi){
  const ord = {scaduta: 3, vicina: 2, da_impostare: 1, ore_ignote: 1, ok: 0};
  let p = null;
  (att.scadenze || []).forEach(s => {
    const st = statoScadenza(s, att.oreAttuali, oggi).stato;
    if(!p || ord[st] > ord[p]) p = st;
  });
  return p;
}
function fmtN(n){ return Number(n).toLocaleString('it-IT', {maximumFractionDigits: 1}); }
function fmtData(iso){ if(!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return d + '/' + m + '/' + y; }

    accessori: (Array.isArray(d.accessori) ? d.accessori : []).map(normAcc).filter(x => x.nome),
    scadenze: (Array.isArray(d.scadenze) ? d.scadenze : []).filter(s => s && s.testo).map(s => ({
      testo: String(s.testo), tipo: s.tipo === 'ore' ? 'ore' : 'data',
      data: s.tipo === 'ore' ? null : (s.data || null), ore: s.tipo === 'ore' && typeof s.ore === 'number' ? s.ore : null
    })),
    note: String(d.note || ''),
    attivo: d.attivo !== false,
    aggiornatoDa: d.aggiornatoDa || null,

}

function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state !== 'running'){ try{ audioCtx.resume(); }catch(e){} }

function beep(){
  if(!audioOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const go = () => {
    const now = ctx.currentTime;
    [784, 988, 1319].forEach((f, i) => {
      const t = now + i * 0.17, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.26);
    });
  };
  if(ctx.state === 'running') go(); else { try{ ctx.resume().then(go).catch(() => {}); }catch(e){} }
}

  box.innerHTML = cats.map(c => '<div class="cat-head">' + esc(c) + '</div><div class="cards">'
    + vis.filter(a => a.categoria === c).sort((x, y) => x.nome.localeCompare(y.nome, 'it')).map(a =>
      '<button class="card' + (a.attivo ? '' : ' off') + '" type="button" data-open="' + esc(a.id) + '">'
      + '<span class="card-name">' + esc(a.nome) + '</span><span class="card-meta">'
      + '<span class="pill qty">×' + a.quantita + '</span>'
      + (a.contaore ? '<span class="pill ore">contaore' + (a.oreAttuali != null ? ' ' + fmtN(a.oreAttuali) + ' h' : '') + '</span>' : '')
      + (a.controlli.length ? '<span class="pill">' + a.controlli.length + ' controlli</span>' : '<span class="pill todo">Controlli da scrivere</span>')
      + badgeScadenze(a, oggi)
      + (a.attivo ? '' : '<span class="pill">disattivato</span>')
      + '</span></button>').join('') + '</div>').join('');
  box.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { openId = b.dataset.open; editing = false; renderDetail(); window.scrollTo(0, 0); }));
}

async function importa(){
  const b = $('importBtn'); if(b){ b.disabled = true; b.textContent = 'Carico...'; }
  try{
    const batch = writeBatch(fbDb);
    const usati = new Set();
    IMPORT.forEach(r => {
      let id = slug(r[1]); while(usati.has(id)) id += '-2'; usati.add(id);
      batch.set(doc(fbDb, 'attrezzi', id), Object.assign(docDaImport(r), {aggiornatoDa: me, aggiornatoAt: new Date().toISOString()}));
    });
    await batch.commit();
    toast('Caricati ' + IMPORT.length + ' attrezzi ✓');
  }catch(e){ toast(erroreFirebase(e), true); if(b){ b.disabled = false; b.textContent = 'Carica i 31 attrezzi'; } }
}

// ---------------- Scheda ----------------
function current(){ return attrezzi.find(a => a.id === openId) || null; }
function apriNuovo(base){
  openId = '__nuovo__';
  editing = true;
  draft = base ? JSON.parse(JSON.stringify(Object.assign({}, base, {id: null, nome: base.nome + ' (copia)', oreAttuali: null, oreAt: null, scadenze: base.scadenze.map(s => Object.assign({}, s, {data: null, ore: null}))})))
               : {id: null, nome: '', categoria: CATEGORIE[0], quantita: 1, contaore: false, controlli: [], accessori: [], scadenze: [], note: '', attivo: true, oreAttuali: null};
  renderDetail();
  window.scrollTo(0, 0);
}
function renderDetail(){
  $('listView').hidden = true; $('detailView').hidden = false;
  const v = $('detailView');
  const a = openId === '__nuovo__' ? null : current();
  if(openId !== '__nuovo__' && !a){ openId = null; renderList(); return; }
  if(editing){ renderEdit(v, a); return; }
  const oggi = oggiISO();
  v.innerHTML = '<button class="btn ghost back" id="backBtn" type="button">← Tutti gli attrezzi</button>'
    + '<div class="sheet">'
    + '<div><div class="cat-head" style="margin:0 0 4px">' + esc(a.categoria) + '</div><h1>' + esc(a.nome) + '</h1>'
    + '<div class="card-meta" style="margin-top:8px"><span class="pill qty">×' + a.quantita + '</span>'
    + (a.contaore ? '<span class="pill ore">contaore · ' + (a.oreAttuali != null ? fmtN(a.oreAttuali) + ' h al ' + fmtData(a.oreAt) : 'ore attuali non note') + '</span>' : '')
    + (a.attivo ? '' : '<span class="pill">disattivato</span>') + '</div>'
    + (a.note ? '<p style="margin:10px 0 0">' + esc(a.note) + '</p>' : '') + '</div>'

    + '<div class="sec"><h2>Controlli in uscita e al rientro</h2>'
    + (a.controlli.length ? '<ul class="list">' + a.controlli.map(c => '<li><span>' + esc(c.testo) + '</span><span class="kind">' + TIPI[c.tipo] + '</span></li>').join('') + '</ul>'
      : '<p class="muted" style="margin:0">Nessun controllo scritto.' + (isUfficio ? ' Tocca «Modifica» per aggiungerli.' : '') + '</p>') + '</div>'

    + '<div class="sec"><h2>Accessori ed extra</h2>'
    + (a.accessori.length ? '<ul class="list">' + a.accessori.map(x => '<li><span>' + esc(x.nome) + '</span>' + (x.pagamento ? '<span class="pill pay" style="margin-left:auto">A PAGAMENTO</span>' : '<span class="kind">in comodato</span>') + '</li>').join('') + '</ul>' : '<p class="muted" style="margin:0">Nessuno.</p>') + '</div>'

    + '<div class="sec"><h2>Scadenze</h2>'
    + (a.scadenze.length ? '<ul class="list">' + a.scadenze.map(s => {
        const st = statoScadenza(s, a.oreAttuali, oggi);
        const cls = st.stato === 'scaduta' ? 'bad' : st.stato === 'vicina' ? 'warn' : (st.stato === 'ok' ? '' : 'todo');
        return '<li><span>' + esc(s.testo) + '</span><span class="pill ' + cls + '" style="margin-left:auto">' + esc(st.testo) + '</span></li>';
      }).join('') + '</ul>' : '<p class="muted" style="margin:0">Nessuna scadenza.</p>') + '</div>'

    + storicoAttrezzoHtml(a)
    + '<div class="sec"><h2>Manutenzioni</h2><div id="manutBox"><p class="muted" style="margin:0">Carico...</p></div></div>'

    + (isUfficio ? '<div class="actions"><button class="btn dark" id="editBtn" type="button">Modifica</button>'
      + '<button class="btn ghost" id="copyBtn" type="button">Copia scheda per un attrezzo nuovo</button>'
      + '<button class="btn danger" id="offBtn" type="button">' + (a.attivo ? 'Disattiva' : 'Riattiva') + '</button></div>' : '')
    + (a.aggiornatoAt ? '<p class="muted" style="margin:0;font-size:13px">Ultima modifica: ' + esc(nomeDaEmail(a.aggiornatoDa)) + ' · ' + fmtData(a.aggiornatoAt) + '</p>' : '')
    + '</div>';

  $('backBtn').addEventListener('click', () => { openId = null; renderList(); });
  if(isUfficio){
    $('editBtn').addEventListener('click', () => { editing = true; draft = JSON.parse(JSON.stringify(a)); renderDetail(); });
    $('copyBtn').addEventListener('click', () => apriNuovo(a));
    const ob = $('offBtn');
    ob.addEventListener('click', async () => {
      if(a.attivo && ob.dataset.armed !== '1'){ ob.dataset.armed = '1'; ob.textContent = 'Tocca ancora: non sarà più noleggiabile'; ob.classList.add('confirm'); return; }
      try{ await updateDoc(doc(fbDb, 'attrezzi', a.id), {attivo: !a.attivo, aggiornatoDa: me, aggiornatoAt: new Date().toISOString()}); toast(a.attivo ? 'Disattivato' : 'Riattivato'); }
      catch(e){ toast(erroreFirebase(e), true); }
    });
  }
  wireCards($('detailView'));
  caricaManutenzioni(a);
}
function storicoAttrezzoHtml(a){
  const lista = noleggi.filter(n => n.stato !== 'annullato' && n.righe.some(r => r.attrezzoId === a.id))
    .sort((x, y) => y.dal.localeCompare(x.dal)).slice(0, 10);
  return '<div class="sec"><h2>Noleggi (ultimi 10)</h2>' + (lista.length ? '<div class="nlist">' + lista.map(cardNol).join('') + '</div>' : '<p class="muted" style="margin:0">Nessun noleggio ancora.</p>') + '</div>';
}

function renderEdit(v, a){
  const d = draft;

    + '<div class="sheet form">'
    + '<h1>' + (a ? 'Modifica scheda' : 'Nuovo attrezzo') + '</h1>'

    + '<button class="add-line" id="addCtrl" type="button">+ Aggiungi controllo</button></div>'

    + '<div class="field"><span class="lbl">Accessori ed extra <span class="muted">(es. benne, rampe in comodato · martello a pagamento)</span></span><div id="accRows" style="display:grid;gap:6px"></div>'
    + '<button class="add-line" id="addAcc" type="button">+ Aggiungi accessorio</button></div>'

    + '<div class="field"><span class="lbl">Scadenze</span><div id="scadRows" style="display:grid;gap:6px"></div>'
    + '<button class="add-line" id="addScad" type="button">+ Aggiungi scadenza</button></div>'

    + '<div class="field"><label for="fNote">Note</label><textarea class="inp" id="fNote" rows="2" maxlength="500">' + esc(d.note) + '</textarea></div>'
    + '<div class="actions"><button class="btn primary" id="saveBtn" type="button">Salva</button><button class="btn ghost" id="cancelBtn" type="button">Annulla</button></div>'
    + '</div>';

  const leggiBase = () => {
    d.nome = $('fNome').value; d.categoria = $('fCat').value; d.note = $('fNote').value;
    d.quantita = parseInt($('fQty').value, 10); d.contaore = $('fOre').checked;
  };
  const drawCtrl = () => {
    $('ctrlRows').innerHTML = d.controlli.map((c, i) =>
      '<div class="edit-row"><input class="inp" data-c="' + i + '" value="' + esc(c.testo) + '" placeholder="Es. Carburante" maxlength="80" aria-label="Controllo ' + (i + 1) + '">'
      + '<select class="inp" data-ct="' + i + '" aria-label="Tipo di risposta">' + Object.keys(TIPI).map(k => '<option value="' + k + '"' + (k === c.tipo ? ' selected' : '') + '>' + TIPI[k] + '</option>').join('') + '</select>'
      + '<button class="sq" type="button" data-up="' + i + '" aria-label="Sposta su">↑</button><button class="sq" type="button" data-dn="' + i + '" aria-label="Sposta giù">↓</button>'
      + '<button class="sq rm" type="button" data-cx="' + i + '" aria-label="Togli">✕</button></div>').join('') || '<p class="muted" style="margin:0">Nessun controllo.</p>';
    $('ctrlRows').querySelectorAll('[data-c]').forEach(el => el.addEventListener('input', () => d.controlli[+el.dataset.c].testo = el.value));
    $('ctrlRows').querySelectorAll('[data-ct]').forEach(el => el.addEventListener('change', () => d.controlli[+el.dataset.ct].tipo = el.value));
    $('ctrlRows').querySelectorAll('[data-cx]').forEach(el => el.addEventListener('click', () => { d.controlli.splice(+el.dataset.cx, 1); drawCtrl(); }));
    const swap = (i, j) => { if(j < 0 || j >= d.controlli.length) return; [d.controlli[i], d.controlli[j]] = [d.controlli[j], d.controlli[i]]; drawCtrl(); };
    $('ctrlRows').querySelectorAll('[data-up]').forEach(el => el.addEventListener('click', () => swap(+el.dataset.up, +el.dataset.up - 1)));
    $('ctrlRows').querySelectorAll('[data-dn]').forEach(el => el.addEventListener('click', () => swap(+el.dataset.dn, +el.dataset.dn + 1)));
  };
  const drawAcc = () => {
    $('accRows').innerHTML = d.accessori.map((x, i) =>
      '<div class="edit-row" style="grid-template-columns:1fr auto auto"><input class="inp" data-a="' + i + '" value="' + esc(x.nome) + '" placeholder="Es. Benna 40 cm" maxlength="80" aria-label="Accessorio ' + (i + 1) + '">'
      + '<label class="acc' + (x.pagamento ? ' pay' : '') + '" style="min-height:44px;padding:6px 10px"><input type="checkbox" data-ap="' + i + '"' + (x.pagamento ? ' checked' : '') + '> A pagamento</label>'
      + '<button class="sq rm" type="button" data-ax="' + i + '" aria-label="Togli">✕</button></div>').join('') || '<p class="muted" style="margin:0">Nessun accessorio.</p>';
    $('accRows').querySelectorAll('[data-a]').forEach(el => el.addEventListener('input', () => d.accessori[+el.dataset.a].nome = el.value));
    $('accRows').querySelectorAll('[data-ap]').forEach(el => el.addEventListener('change', () => { d.accessori[+el.dataset.ap].pagamento = el.checked; el.parentNode.classList.toggle('pay', el.checked); }));
    $('accRows').querySelectorAll('[data-ax]').forEach(el => el.addEventListener('click', () => { d.accessori.splice(+el.dataset.ax, 1); drawAcc(); }));

      '<div class="edit-row scad"><input class="inp" data-s="' + i + '" value="' + esc(s.testo) + '" placeholder="Es. Tagliando" maxlength="80" aria-label="Scadenza ' + (i + 1) + '">'

      + (s.tipo === 'ore'

    $('scadRows').querySelectorAll('[data-st]').forEach(el => el.addEventListener('change', () => { const s = d.scadenze[+el.dataset.st]; s.tipo = el.value; s.data = null; s.ore = null; drawScad(); }));
    $('scadRows').querySelectorAll('[data-sv]').forEach(el => el.addEventListener('input', () => {
      const s = d.scadenze[+el.dataset.sv];
      if(s.tipo === 'ore'){ const n = parseFloat(String(el.value).replace(',', '.')); s.ore = isFinite(n) ? n : null; } else s.data = el.value || null;
    }));
    $('scadRows').querySelectorAll('[data-sx]').forEach(el => el.addEventListener('click', () => { d.scadenze.splice(+el.dataset.sx, 1); drawScad(); }));
  };

  $('addScad').addEventListener('click', () => { d.scadenze.push({testo: '', tipo: 'data', data: null, ore: null}); drawScad(); const els = $('scadRows').querySelectorAll('[data-s]'); els[els.length - 1].focus(); });

  const annulla = () => { editing = false; draft = null; if(openId === '__nuovo__') openId = null; render(); };
  $('cancelTop').addEventListener('click', annulla);
  $('cancelBtn').addEventListener('click', annulla);

    leggiBase();

    if(!Number.isInteger(d.quantita) || d.quantita < 1){ toast('La quantità deve essere un numero intero da 1 in su.', true); $('fQty').focus(); return; }
    const pulito = {
      nome, categoria: d.categoria.trim() || 'Altro', quantita: d.quantita, contaore: d.contaore,
      controlli: d.controlli.map(c => ({testo: c.testo.trim(), tipo: c.tipo})).filter(c => c.testo),
      accessori: d.accessori.map(x => ({nome: String(x.nome || '').trim(), pagamento: x.pagamento === true})).filter(x => x.nome),
      scadenze: d.scadenze.map(s => ({testo: s.testo.trim(), tipo: s.tipo, data: s.tipo === 'data' ? (s.data || null) : null, ore: s.tipo === 'ore' ? s.ore : null})).filter(s => s.testo),
      note: d.note.trim(), attivo: d.attivo !== false,

    };

      let id = a ? a.id : slug(nome);
      if(!a){ while(attrezzi.some(x => x.id === id)) id += '-' + Math.random().toString(36).slice(2, 5); }
      await setDoc(doc(fbDb, 'attrezzi', id), pulito, {merge: true});
      editing = false; draft = null; openId = id;
      toast('Salvato ✓');
      render();
    }catch(e){ toast(erroreFirebase(e), true); b.disabled = false; b.textContent = 'Salva'; }
  });
}

// ---------------- Manutenzioni ----------------
async function caricaManutenzioni(a, forza){
  const box = $('manutBox'); if(!box) return;
  let lista = manutCache[a.id];
  if(!lista || forza){
    try{
      const snap = await getDocs(query(collection(fbDb, 'attrezzi', a.id, 'manutenzioni'), orderBy('data', 'desc')));
      lista = snap.docs.map(x => x.data());
      manutCache[a.id] = lista;
    }catch(e){ box.innerHTML = '<p class="muted" style="margin:0">' + esc(erroreFirebase(e)) + '</p>'; return; }
  }
  if(openId !== a.id || editing || !$('manutBox')) return;
  $('manutBox').innerHTML = '<div class="manut">'
    + (lista.length ? lista.map(m => '<div class="manut-item"><div class="manut-top"><span>' + fmtData(m.data) + '</span>'
        + (m.ore != null ? '<span>' + fmtN(m.ore) + ' h</span>' : '') + '<span>' + esc(m.chi || '') + '</span></div>'
        + '<div class="manut-what">' + esc(m.cosa) + '</div>' + (m.note ? '<div class="muted">' + esc(m.note) + '</div>' : '')
        + (m.prossima ? '<div class="muted">↻ Prossima: ' + (m.prossima.tipo === 'ore' ? fmtN(m.prossima.ore) + ' h' : fmtData(m.prossima.data)) + '</div>' : '') + '</div>').join('')
      : '<p class="muted" style="margin:0">Nessuna manutenzione registrata.</p>')
    + (isUfficio ? '<button class="add-line" id="addManut" type="button">+ Registra una manutenzione</button><div id="manutForm"></div>' : '')
    + '</div>';
  if(isUfficio) $('addManut').addEventListener('click', () => formManutenzione(a));
}
function aggiungiMesi(iso, mesi){
  const y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1, d = +iso.slice(8, 10);
  const ultimo = new Date(Date.UTC(y, m + mesi + 1, 0)).getUTCDate();
  const r = new Date(Date.UTC(y, m + mesi, Math.min(d, ultimo)));
  return r.toISOString().slice(0, 10);
}
function normTesto(s){ return slug(s).replace(/-/g, ' '); }
// Quale scadenza aggiornare: quella con lo stesso nome e lo stesso tipo, se c'è
function scadenzaCollegata(scadenze, cosa, tipo){
  const n = normTesto(cosa);
  return scadenze.findIndex(s => s.tipo === tipo && normTesto(s.testo) === n);
}
window.__noleggiTest.aggiungiMesi = aggiungiMesi;
window.__noleggiTest.scadenzaCollegata = scadenzaCollegata;

    let prossima = null, scelta = null;

// ---------------- Funzioni pure (provate prima della consegna) ----------------
const LIVELLI = ['pieno', '3/4', '1/2', '1/4', 'vuoto'];
const LIVELLI_TXT = {'pieno': 'Pieno', '3/4': '¾', '1/2': '½', '1/4': '¼', 'vuoto': 'Vuoto'};
function addGiorni(iso, n){
  const t = Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) + n * 86400000;
  return new Date(t).toISOString().slice(0, 10);
}
function giornoDi(isoTime){ return oggiISO(new Date(isoTime)); }
// Giorni in cui un noleggio tiene occupati gli attrezzi (estremi compresi).
// Prenotato: dal → al. Fuori: dall'uscita reale (o dal) → al; se è in ritardo, fino a oggi.
function periodoNoleggio(n, oggi){
  if(n.stato === 'prenotato') return [n.dal, n.al];
  if(n.stato === 'fuori'){
    const inizio = n.uscita && n.uscita.at ? [n.dal, giornoDi(n.uscita.at)].sort()[0] : n.dal;
    return [inizio, n.al < oggi ? oggi : n.al];
  }
  return null;
}
function pezziInUso(n, attrezzoId){
  return (n.righe || []).filter(r => r.attrezzoId === attrezzoId)
    .reduce((s, r) => s + Math.max(0, (r.qty || 0) - (r.rientrati || 0)), 0);
}
function occupatiGiorno(attrezzoId, giorno, noleggi, oggi, escludiId){
  let tot = 0;
  noleggi.forEach(n => {
    if(n.id === escludiId) return;
    const p = periodoNoleggio(n, oggi);
    if(!p || giorno < p[0] || giorno > p[1]) return;
    tot += pezziInUso(n, attrezzoId);
  });
  return tot;
}
// Pezzi liberi in TUTTI i giorni tra dal e al (il giorno peggiore decide)
function liberiNelPeriodo(att, dal, al, noleggi, oggi, escludiId){
  let peggio = 0;
  for(let g = dal, k = 0; g <= al && k < 400; g = addGiorni(g, 1), k++){
    peggio = Math.max(peggio, occupatiGiorno(att.id, g, noleggi, oggi, escludiId));
  }
  return att.quantita - peggio;
}
// Stato da mostrare: in_ritardo | da_consegnare | fuori | prenotato | chiuso | annullato
function statoVisibile(n, oggi){
  if(n.stato === 'fuori') return n.al < oggi ? 'in_ritardo' : 'fuori';
  if(n.stato === 'prenotato') return n.dal <= oggi ? 'da_consegnare' : 'prenotato';
  return n.stato;
}
// Confronto uscita → rientro di un controllo: true se è da segnalare all'ufficio
function controlloPeggiorato(tipo, prima, dopo){
  if(prima == null || dopo == null || dopo === '') return false;
  if(tipo === 'livello') return LIVELLI.indexOf(dopo) > LIVELLI.indexOf(prima);
  if(tipo === 'numero') return Number(dopo) < Number(prima);
  if(tipo === 'si_no') return prima !== dopo;
  return false;
}
function valoreTxt(tipo, v){
  if(v == null || v === '') return '—';
  if(tipo === 'livello') return LIVELLI_TXT[v] || v;
  if(tipo === 'si_no') return v === 'si' ? 'Sì' : 'No';
  return String(v);
}
function nuovoNumero(d){
  d = d || new Date();
  const z = n => String(n).padStart(2, '0');
  const r = Math.random().toString(36).slice(2, 5).toUpperCase().replace(/[O0I1]/g, 'X');
  return String(d.getFullYear()).slice(2) + z(d.getMonth() + 1) + z(d.getDate()) + '-' + r;
}
function normNoleggio(id, d){
  d = d || {};
  return {
    id, numero: d.numero || id, cliente: String(d.cliente || ''), tipoCliente: d.tipoCliente || '',
    note: String(d.note || ''), dal: d.dal || oggiISO(), al: d.al || d.dal || oggiISO(),
    stato: ['prenotato', 'fuori', 'chiuso', 'annullato'].includes(d.stato) ? d.stato : 'prenotato',
    righe: (Array.isArray(d.righe) ? d.righe : []).map(r => ({attrezzoId: r.attrezzoId, nome: r.nome || '', qty: r.qty || 0, rientrati: r.rientrati || 0})),
    uscita: d.uscita || null, rientri: Array.isArray(d.rientri) ? d.rientri : [],
    proroghe: Array.isArray(d.proroghe) ? d.proroghe : [],
    creatoDa: d.creatoDa || '', creatoAt: d.creatoAt || null, chiusoAt: d.chiusoAt || null, esceSubito: d.esceSubito === true,
    annullatoDa: d.annullatoDa || null, annullatoAt: d.annullatoAt || null,
    datiPrivato: d.datiPrivato === true, buoniInviati: (d.buoniInviati && typeof d.buoniInviati === 'object') ? d.buoniInviati : {}
  };
}

// ---------------- PASSO 4: buoni di carico automatici (raccolta "orders", stesso formato della v19) ----------------
// Numero del buono fisso per noleggio e fase: se si reinvia, si sovrascrive lo stesso buono (niente doppioni).
function idBuono(numero, fase, k){ return 'BC-N' + numero + (fase === 'uscita' ? '-U' : '-R' + k); }
function giorniTra(da, a){
  const t = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
  return Math.round((t(a) - t(da)) / 86400000);
}
function rigaBuono(desc, qty, note){ return {desc, um: 'PZ', qty, price: 0, manual: true, note: note || '', reso: false}; }
function righeAccessori(nomeAtt, accessori, fase){
  return (accessori || []).filter(x => fase === 'uscita' ? x.ok : true).map(x => {
    const desc = x.pagamento ? x.nome.toUpperCase() + ' – A PAGAMENTO' : '+ ' + x.nome + ' (comodato)';
    const note = fase === 'uscita'
      ? (x.pagamento ? 'Extra a pagamento con ' + nomeAtt : 'Accessorio di ' + nomeAtt + ': deve rientrare')
      : (x.ok === true ? 'Rientrato con ' + nomeAtt : x.ok === false ? '⚠ NON RIENTRATO' : '⚠ non controllato al rientro');
    return rigaBuono(desc, 1, note);
  });
}
// n = noleggio normalizzato, uscita = oggetto salvato nel noleggio, nFoto = foto fatte
function buonoUscita(n, uscita, nFoto){
  const items = [];
  const giorno = giornoDi(uscita.at);
  (uscita.voci || []).forEach(v => {
    const r = n.righe.find(x => x.attrezzoId === v.attrezzoId) || {nome: v.attrezzoId, qty: 1};
    items.push(rigaBuono('NOLEGGIO ' + r.nome.toUpperCase(), r.qty,
      'Dal ' + fmtData(giorno) + ' al ' + fmtData(n.al) + ' (previsto)' + (v.ore != null && isFinite(v.ore) ? ' · contaore ' + fmtN(v.ore) + ' h' : '')));
    righeAccessori(r.nome, v.accessori, 'uscita').forEach(x => items.push(x));
  });
  const note = ['NOLEGGIO N. ' + n.numero + ' – USCITA', 'Rientro previsto ' + fmtData(n.al)]
    .concat(uscita.note ? ['Nota: ' + uscita.note] : []).concat(nFoto ? [nFoto + ' foto nell\'app noleggi'] : []).join(' · ');
  return {id: idBuono(n.numero, 'uscita'), operator: uscita.da, customer: n.cliente, customerType: n.tipoCliente || '', colli: null,
    note, items, total: 0, createdAt: uscita.at, status: 'in_attesa', noleggio: {id: n.id, numero: n.numero, fase: 'uscita'}};
}
// k = numero del rientro (1, 2… se rientra a pezzi); righeDopo = righe del noleggio dopo questo rientro
function buonoRientro(n, rientro, k, righeDopo, nFoto){
  const items = [];
  const giornoU = n.uscita && n.uscita.at ? giornoDi(n.uscita.at) : n.dal;
  const giornoR = giornoDi(rientro.at);
  const gg = Math.max(1, giorniTra(giornoU, giornoR));
  const ritardo = giorniTra(n.al, giornoR);
  (rientro.voci || []).forEach(v => {
    const r = n.righe.find(x => x.attrezzoId === v.attrezzoId) || {nome: v.attrezzoId};
    items.push(rigaBuono('RIENTRO NOLEGGIO ' + r.nome.toUpperCase(), v.qty,
      'Uscito ' + fmtData(giornoU) + ', rientrato ' + fmtData(giornoR) + ': ' + gg + (gg === 1 ? ' giorno' : ' giorni')
      + (ritardo > 0 ? ' (previsto ' + fmtData(n.al) + ', ' + ritardo + ' g di ritardo)' : '')
      + (v.ore != null && isFinite(v.ore) ? ' · contaore ' + fmtN(v.ore) + ' h' : '')));
    righeAccessori(r.nome, v.accessori, 'rientro').forEach(x => items.push(x));
  });
  const fuori = (righeDopo || []).filter(r => (r.rientrati || 0) < r.qty).map(r => r.nome + ' ×' + (r.qty - (r.rientrati || 0)));
  const note = ['NOLEGGIO N. ' + n.numero + ' – RIENTRO' + (k > 1 || fuori.length ? ' ' + k : '')]
    .concat(fuori.length ? ['RIENTRO PARZIALE, ancora fuori: ' + fuori.join(', ')] : [])
    .concat((rientro.segnalazioni || []).length ? ['⚠ ' + rientro.segnalazioni.join('; ')] : [])
    .concat(rientro.note ? ['Nota: ' + rientro.note] : [])
    .concat(nFoto ? [nFoto + ' foto nell\'app noleggi'] : []).join(' · ');
  return {id: idBuono(n.numero, 'rientro', k), operator: rientro.da, customer: n.cliente, customerType: n.tipoCliente || '', colli: null,
    note, items, total: 0, createdAt: rientro.at, status: 'in_attesa', noleggio: {id: n.id, numero: n.numero, fase: 'rientro', k}};
}
Object.assign(window.__noleggiTest, {addGiorni, periodoNoleggio, occupatiGiorno, liberiNelPeriodo, statoVisibile, controlloPeggiorato, normNoleggio, nuovoNumero, buonoUscita, buonoRientro, idBuono, giorniTra});

function pillStato(n){ const s = statoVisibile(n, oggiISO()); return '<span class="spill s-' + s + '">' + STATI_TXT[s] + '</span>'; }
function oraTxt(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', {weekday: 'short', day: '2-digit', month: '2-digit'}) + ' ' + d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'});
}
function giornoTxt(iso){ const [y, m, d] = iso.split('-'); return new Date(Date.UTC(+y, +m - 1, +d)).toLocaleDateString('it-IT', {weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'UTC'}); }
function attrezzoById(id){ return attrezzi.find(a => a.id === id) || null; }

function nolErr(code){

  };
  return t[code] || erroreFirebase({code});

async function txNoleggio(id, mutate){
  try{
    await runTransaction(fbDb, async tx => {
      const ref = doc(fbDb, 'noleggi', id);
      const snap = await tx.get(ref);
      if(!snap.exists()) throw new Error('sparito');
      const raw = snap.data();
      const patch = mutate(raw, normNoleggio(id, raw));
      tx.update(ref, Object.assign(patch, {aggiornatoAt: new Date().toISOString()}));
    });
    return '';
  }catch(e){ return (e && (e.code || e.message)) || 'errore'; }
}
// Le ore del contaore scritte in uscita/rientro aggiornano l'attrezzo (solo se più alte)
function aggiornaOre(voci, quando){
  voci.forEach(v => {
    const a = attrezzoById(v.attrezzoId);
    const ore = parseFloat(String(v.ore || '').replace(',', '.'));
    if(!a || !a.contaore || !isFinite(ore)) return;
    if(a.oreAttuali != null && ore <= a.oreAttuali) return;
    updateDoc(doc(fbDb, 'attrezzi', a.id), {oreAttuali: ore, oreAt: quando}).catch(() => {});
  });
}

// ---------------- Calendario ----------------
function lunedi(iso){
  const d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)));
  const dow = (d.getUTCDay() + 6) % 7;
  return addGiorni(iso, -dow);
}
function renderCal(){
  const oggi = oggiISO();
  if(!calInizio) calInizio = lunedi(oggi);
  const giorni = Array.from({length: 7}, (_, i) => addGiorni(calInizio, i));
  const att = attrezzi.filter(a => a.attivo);
  const cats = [...new Set(CATEGORIE.concat(att.map(a => a.categoria)))].filter(c => att.some(a => a.categoria === c));
  let righe = '';
  cats.forEach(c => {
    righe += '<tr class="cal-cat"><th colspan="8">' + esc(c) + '</th></tr>';
    att.filter(a => a.categoria === c).sort((x, y) => x.nome.localeCompare(y.nome, 'it')).forEach(a => {
      righe += '<tr><th class="cal-name">' + esc(a.nome) + (a.quantita > 1 ? ' <span class="muted">×' + a.quantita + '</span>' : '') + '</th>';
      giorni.forEach(g => {
        const occ = occupatiGiorno(a.id, g, noleggi, oggi);
        const ritardo = occ && noleggi.some(n => statoVisibile(n, oggi) === 'in_ritardo' && pezziInUso(n, a.id) && g >= n.al && g <= oggi);
        const cls = !occ ? '' : ritardo ? 'c-late' : occ >= a.quantita ? 'c-full' : 'c-part';
        const sel = calSel && calSel.attrezzoId === a.id && calSel.giorno === g ? ' c-sel' : '';
        righe += '<td><button type="button" class="cal-cell ' + cls + sel + (g === oggi ? ' c-today' : '') + '" data-ca="' + esc(a.id) + '" data-cg="' + g + '" aria-label="' + esc(a.nome) + ' ' + giornoTxt(g) + '">'
          + (occ ? (a.quantita > 1 ? occ + '/' + a.quantita : (ritardo ? '!' : '●')) : '') + '</button></td>';
      });
      righe += '</tr>';
    });
  });
  let dett = '';
  if(calSel){
    const a = attrezzoById(calSel.attrezzoId);
    const lista = noleggi.filter(n => { const p = periodoNoleggio(n, oggi); return p && calSel.giorno >= p[0] && calSel.giorno <= p[1] && pezziInUso(n, calSel.attrezzoId); });
    dett = '<div class="cat-head">' + esc(a ? a.nome : '') + ' · ' + giornoTxt(calSel.giorno) + '</div>'
      + (lista.length ? '<div class="nlist">' + lista.map(cardNol).join('') + '</div>' : '<p class="muted small">Libero in questo giorno.</p>');
  }
  $('tabCal').innerHTML = '<div class="cal-nav"><button class="btn ghost" id="calPrev" type="button">‹ Settimana prima</button>'
    + '<button class="btn ghost" id="calOggi" type="button">Questa settimana</button>'
    + '<button class="btn ghost" id="calNext" type="button">Settimana dopo ›</button></div>'
    + '<div class="cal-legend"><span><i class="c-part"></i> in parte occupato</span><span><i class="c-full"></i> tutto occupato</span><span><i class="c-late"></i> in ritardo</span></div>'
    + (att.length ? '<div class="cal-wrap"><table class="cal"><thead><tr><th></th>'
      + giorni.map(g => '<th class="' + (g === oggi ? 'c-today-h' : '') + '">' + giornoTxt(g) + '</th>').join('') + '</tr></thead><tbody>' + righe + '</tbody></table></div>'
      : '<p class="muted">Nessun attrezzo attivo.</p>')
    + '<div id="calDett">' + dett + '</div>';
  $('calPrev').addEventListener('click', () => { calInizio = addGiorni(calInizio, -7); calSel = null; renderCal(); });
  $('calNext').addEventListener('click', () => { calInizio = addGiorni(calInizio, 7); calSel = null; renderCal(); });
  $('calOggi').addEventListener('click', () => { calInizio = lunedi(oggiISO()); calSel = null; renderCal(); });
  $('tabCal').querySelectorAll('[data-ca]').forEach(b => b.addEventListener('click', () => {
    calSel = {attrezzoId: b.dataset.ca, giorno: b.dataset.cg}; renderCal();
    $('calDett').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }));
  wireCards($('calDett'));
}

function opzioniAttrezzi(sel){
  const att = attrezzi.filter(a => a.attivo);
  const cats = [...new Set(CATEGORIE.concat(att.map(a => a.categoria)))].filter(c => att.some(a => a.categoria === c));

    + att.filter(a => a.categoria === c).sort((x, y) => x.nome.localeCompare(y.nome, 'it'))
      .map(a => '<option value="' + esc(a.id) + '"' + (a.id === sel ? ' selected' : '') + '>' + esc(a.nome) + (a.quantita > 1 ? ' (×' + a.quantita + ')' : '') + '</option>').join('')
    + '</optgroup>').join('');

// Controllo disponibilità di tutte le righe: [{i, att, liberi, chiesti}]
function controllaDisponibilita(righe, dal, al, escludiId){
  const oggi = oggiISO();
  // stesso attrezzo su più righe: si sommano
  const chiesti = {};
  righe.forEach(r => { if(r.attrezzoId) chiesti[r.attrezzoId] = (chiesti[r.attrezzoId] || 0) + (parseInt(r.qty, 10) || 0); });
  return Object.keys(chiesti).map(id => {
    const att = attrezzoById(id);
    const liberi = att ? liberiNelPeriodo(att, dal, al, noleggi, oggi, escludiId) : 0;
    return {id, att, liberi, chiesti: chiesti[id]};
  });
}
function testoDisp(c){
  if(!c.att) return '';
  if(c.liberi >= c.chiesti) return '<span class="ok">✓ ' + c.liberi + ' di ' + c.att.quantita + ' liberi in quei giorni</span>';
  return '<span class="ko">✕ solo ' + Math.max(0, c.liberi) + ' di ' + c.att.quantita + ' liberi in quei giorni</span>';
}

function disegnaRigheNuovo(){

      + '<button class="sq rm" type="button" data-rx="' + i + '" aria-label="Togli"' + (F.righe.length === 1 ? ' disabled' : '') + '>✕</button></div>'
      + '<div class="disp" data-disp="' + i + '"></div></div>';
  }).join('');
  $('nRighe').querySelectorAll('[data-ra]').forEach(el => el.addEventListener('change', () => {
    const r = F.righe[+el.dataset.ra]; r.attrezzoId = el.value;

function aggiornaDisp(){
  const ok = F.al >= F.dal;
  const contr = ok ? controllaDisponibilita(F.righe, F.dal, F.al, null) : [];
  F.righe.forEach((r, i) => {
    const el = document.querySelector('[data-disp="' + i + '"]'); if(!el) return;
    if(!ok){ el.innerHTML = '<span class="ko">Il rientro è prima del ritiro.</span>'; return; }
    const c = contr.find(x => x.id === r.attrezzoId);
    el.innerHTML = c ? testoDisp(c) : '';
  });
  const b = $('nSave'); if(b && !F.forza){ b.textContent = F.esce ? 'Avanti: controlli di uscita' : 'Salva prenotazione'; b.classList.remove('force'); }
}
async function salvaNuovo(){
  if(serveNome()) return;
  const b = $('nSave');
  const cliente = F.cliente.trim();
  if(!cliente){ toast('Scrivi il nome del cliente.', true); $('nCli').focus(); return; }
  if(!F.dal || !F.al || F.al < F.dal){ toast('Controlla le date: il rientro non può essere prima del ritiro.', true); return; }
  const righe = F.righe.filter(r => r.attrezzoId);
  if(!righe.length){ toast('Scegli almeno un attrezzo.', true); return; }
  if(righe.some(r => !Number.isInteger(r.qty) || r.qty < 1)){ toast('Le quantità devono essere numeri interi da 1 in su.', true); return; }
  const mancanti = controllaDisponibilita(righe, F.dal, F.al, null).filter(c => c.liberi < c.chiesti);
  if(mancanti.length && !F.forza){
    const elenco = mancanti.map(c => c.att.nome + ' (liberi ' + Math.max(0, c.liberi) + ', chiesti ' + c.chiesti + ')').join(', ');
    if(!isUfficio){ toast('Non disponibile in quei giorni: ' + elenco + '. Chiedi all\'ufficio.', true); return; }
    F.forza = true; b.textContent = 'Tocca ancora: salva oltre la disponibilità'; b.classList.add('force');
    toast('Non disponibile: ' + elenco + '. Puoi forzare perché sei ufficio.', true);
    return;
  }
  // stesso attrezzo su più righe: le unisco
  const unite = [];
  righe.forEach(r => { const u = unite.find(x => x.attrezzoId === r.attrezzoId); if(u) u.qty += r.qty; else unite.push({attrezzoId: r.attrezzoId, nome: attrezzoById(r.attrezzoId).nome, qty: r.qty, rientrati: 0}); });
  const numero = nuovoNumero();
  const now = new Date().toISOString();
  const data = {numero, cliente, tipoCliente: F.tipoCliente, note: F.note.trim(), dal: F.dal, al: F.al, stato: 'prenotato',
    righe: unite, uscita: null, rientri: [], proroghe: [], forzato: mancanti.length ? true : false, datiPrivato: false,
    creatoDa: nomeMio(), creatoDaEmail: me, creatoAt: now, aggiornatoAt: now};
  if(F.esce){
    // "Esce adesso": non si salva niente finché non si conferma l'uscita
    pendingEsce = {data, form: F};
    apriUscita(numero, normNoleggio(numero, data));
    return;
  }
  b.disabled = true; b.textContent = 'Salvo...';
  try{
    await setDoc(doc(fbDb, 'noleggi', numero), data);
    const esce = F.esce;
    // di solito Firebase l'ha già fatta arrivare: la aggiungo solo se manca
    if(!noleggi.some(x => x.id === numero)) noleggi = noleggi.concat([normNoleggio(numero, data)]);
    if(isDoc && F.tipoCliente === 'privato') await salvaDatiPrivato(numero, cliente, F.telefono, F.documento, '');
    if(esce) apriUscita(numero); else { toast('Prenotazione salvata ✓'); apriNol(numero); }
  }catch(e){ toast(erroreFirebase(e), true); b.disabled = false; b.textContent = F.esce ? 'Avanti: controlli di uscita' : 'Salva prenotazione'; }
}

// ---------------- Controlli (uscita e rientro) ----------------
function inputControllo(chiave, c){
  const v = c.valore;
  if(c.tipo === 'si_no') return '<div class="actions">' + ['si', 'no'].map(x => '<button type="button" class="chipv' + (v === x ? ' on' : '') + '" data-k="' + chiave + '" data-v="' + x + '">' + (x === 'si' ? 'Sì' : 'No') + '</button>').join('') + '</div>';
  if(c.tipo === 'livello') return '<div class="actions">' + LIVELLI.map(x => '<button type="button" class="chipv' + (v === x ? ' on' : '') + '" data-k="' + chiave + '" data-v="' + x + '">' + LIVELLI_TXT[x] + '</button>').join('') + '</div>';
  if(c.tipo === 'numero') return '<input class="inp" style="max-width:160px" type="number" inputmode="decimal" step="any" data-kn="' + chiave + '" value="' + (v == null ? '' : esc(v)) + '" aria-label="' + esc(c.testo) + '">';
  return '<input class="inp" data-kn="' + chiave + '" value="' + (v == null ? '' : esc(v)) + '" maxlength="200" aria-label="' + esc(c.testo) + '">';
}
// collega pulsanti e campi dei controlli all'oggetto F.voci[i].controlli[j]
function wireControlli(box, onChange){
  box.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    const [i, j] = b.dataset.k.split('.').map(Number);
    const c = F.voci[i].controlli[j];
    c.valore = c.valore === b.dataset.v ? null : b.dataset.v;
    box.querySelectorAll('[data-k="' + b.dataset.k + '"]').forEach(x => x.classList.toggle('on', x.dataset.v === c.valore));
    if(onChange) onChange(i, j);
  }));
  box.querySelectorAll('[data-kn]').forEach(el => el.addEventListener('input', () => {
    const [i, j] = el.dataset.kn.split('.').map(Number);
    F.voci[i].controlli[j].valore = el.value.trim() === '' ? null : el.value.trim();
    if(onChange) onChange(i, j);
  }));
  box.querySelectorAll('[data-acc]').forEach(el => el.addEventListener('change', () => {
    const [i, j] = el.dataset.acc.split('.').map(Number);
    F.voci[i].accessori[j].ok = el.checked;
  }));
  box.querySelectorAll('[data-accv]').forEach(b => b.addEventListener('click', () => {
    const [i, j] = b.dataset.accv.split('.').map(Number);
    const x = F.voci[i].accessori[j], val = b.dataset.v === 'si';
    x.ok = x.ok === val ? null : val;
    box.querySelectorAll('[data-accv="' + b.dataset.accv + '"]').forEach(y => y.classList.toggle('on', x.ok === (y.dataset.v === 'si')));
    if(onChange) onChange(-1, -1);
  }));
  box.querySelectorAll('[data-ore]').forEach(el => el.addEventListener('input', () => { F.voci[+el.dataset.ore].ore = el.value; }));
}
function mancantiControlli(voci){
  return voci.reduce((s, v) => s + (v.salta ? 0 : v.controlli.filter(c => c.valore == null || c.valore === '').length
    + (v.accessori || []).filter(x => x.ok == null).length), 0);
}

// ---------------- Uscita ----------------
let pendingEsce = null; // {data, form}: uscita al banco non ancora confermata
function apriUscita(id, nPronto){
  const n = nPronto || findNol(id); if(!n) return;
  if(!nPronto) pendingEsce = null;
  nolMode = 'uscita'; nolId = id;
  F = {fase: 'uscita', armed: false, note: '', voci: n.righe.map(r => {
    const a = attrezzoById(r.attrezzoId) || {controlli: [], accessori: [], contaore: false};
    return {attrezzoId: r.attrezzoId, nome: r.nome, qty: r.qty, contaore: a.contaore,
      controlli: a.controlli.map(c => ({testo: c.testo, tipo: c.tipo, valore: null})),
      accessori: a.accessori.map(x => ({nome: x.nome, pagamento: x.pagamento, ok: false})), ore: ''};
  })};

}

function apriRientro(id){
  const n = findNol(id); if(!n) return;
  nolMode = 'rientro'; nolId = id;
  F = {fase: 'rientro', armed: false, note: '', voci: n.righe.filter(r => r.qty - r.rientrati > 0).map(r => {
    const a = attrezzoById(r.attrezzoId) || {controlli: [], accessori: [], contaore: false};
    const u = n.uscita && (n.uscita.voci || []).find(x => x.attrezzoId === r.attrezzoId);
    const controlli = (u ? u.controlli : a.controlli.map(c => ({testo: c.testo, tipo: c.tipo, valore: null})))
      .map(c => ({testo: c.testo, tipo: c.tipo, prima: c.valore == null ? null : c.valore, valore: null}));
    // al rientro si controllano solo quelli usciti e non ancora rientrati in un rientro precedente
    const giaRientrati = new Set(n.rientri.flatMap(rr => (rr.voci || []).filter(x => x.attrezzoId === r.attrezzoId).flatMap(x => (x.accessori || []).filter(y => y.ok === true).map(y => y.nome))));
    const accessori = (u ? (u.accessori || []).filter(x => x.ok) : a.accessori)
      .filter(x => !giaRientrati.has(x.nome))
      .map(x => ({nome: x.nome, pagamento: x.pagamento === true, ok: null}));
    const rest = r.qty - r.rientrati;
    return {attrezzoId: r.attrezzoId, nome: r.nome, qty: rest, rest, contaore: a.contaore, controlli, accessori, ore: '', salta: false};
  })};
  render(); disegnaRientro(n); window.scrollTo(0, 0);
}

function mostraDiff(i, j){
  const el = document.querySelector('[data-diff="' + i + '.' + j + '"]'); if(!el) return;
  const c = F.voci[i].controlli[j];
  el.textContent = controlloPeggiorato(c.tipo, c.prima, c.valore) ? '⚠ Diverso da quando è uscito: verrà segnalato all\'ufficio' : '';
}
function segnalazioniDa(voci){
  const out = [];
  voci.forEach(v => {
    if(v.salta) return;
    v.controlli.forEach(c => { if(controlloPeggiorato(c.tipo, c.prima, c.valore)) out.push(v.nome + ': ' + c.testo + ' ' + valoreTxt(c.tipo, c.prima) + ' → ' + valoreTxt(c.tipo, c.valore)); });
    v.accessori.forEach(x => {
      if(x.ok === false) out.push(v.nome + ': NON rientrato – ' + x.nome + (x.pagamento ? ' (a pagamento)' : ''));
      else if(x.ok == null) out.push(v.nome + ': non controllato se è rientrato – ' + x.nome);
    });
  });
  return out;
}
async function confermaRientro(){
  if(serveNome()) return;
  const b = $('rOk');

  const manc = mancantiControlli(F.voci);

  const now = new Date().toISOString();

    voci: voci.map(v => ({attrezzoId: v.attrezzoId, qty: v.qty, controlli: v.controlli.map(c => ({testo: c.testo, tipo: c.tipo, prima: c.prima, valore: c.valore})),
      accessori: v.accessori.map(x => ({nome: x.nome, pagamento: x.pagamento === true, ok: x.ok == null ? null : x.ok})), ore: v.ore === '' ? null : parseFloat(String(v.ore).replace(',', '.'))}))};
  const nFoto = voci.reduce((s, v) => s + (v.foto || []).length, 0);
  b.disabled = true; b.textContent = 'Salvo...';
  let chiuso = false, k = 1, righeDopo = [], nPrima = null;
  const err = await txNoleggio(nolId, (raw, n) => {
    if(n.stato !== 'fuori') throw new Error(n.stato === 'chiuso' ? 'gia_chiuso' : 'non_fuori');
    const righe = (raw.righe || []).map(r => {
      const v = voci.find(x => x.attrezzoId === r.attrezzoId);
      return v ? Object.assign({}, r, {rientrati: Math.min(r.qty, (r.rientrati || 0) + v.qty)}) : r;
    });
    chiuso = righe.every(r => (r.rientrati || 0) >= r.qty);
    k = (raw.rientri || []).length + 1; righeDopo = righe; nPrima = n;
    rientro.buono = idBuono(n.numero, 'rientro', k);
    const patch = {righe, rientri: (raw.rientri || []).concat([rientro])};
    if(chiuso){ patch.stato = 'chiuso'; patch.chiusoAt = now; }
    return patch;
  });
  if(err){ toast(nolErr(err), true); b.disabled = false; b.textContent = 'Conferma rientro'; F.armed = false; return; }
  b.textContent = 'Invio il buono...';
  const okBuono = await inviaBuono(buonoRientro(nPrima, rientro, k, righeDopo, nFoto), nolId);
  if(voci.some(v => (v.foto || []).length)){ b.textContent = 'Salvo le foto...'; await salvaFoto(nolId, (findNol(nolId) || {}).numero || nolId, 'rientro', voci, now); }

  apriNol(nolId);
}

        + (n.datiPrivato ? '<button class="btn ghost" id="privLoad" type="button">Mostra telefono e documento</button>' : '<p class="warnbox" style="margin:0 0 8px">Mancano telefono e/o documento.</p><button class="btn dark" id="privLoad" type="button">Completa i dati</button>')
        + '</div></div>' : '')
    + (segn.length ? '<div class="sec segn"><h2>Segnalazioni per l\'ufficio</h2><ul class="list">' + segn.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '')
    + (n.note ? '<div class="sec"><h2>Note</h2><p style="margin:0">' + esc(n.note) + '</p></div>' : '')
    + '<div class="actions">'
    + (n.stato === 'prenotato' ? '<button class="btn primary big" id="xUscita" type="button">Esce adesso</button><button class="btn ghost" id="xDate" type="button">Cambia date</button><button class="btn danger" id="xAnn" type="button">Annulla prenotazione</button>' : '')
    + (n.stato === 'fuori' ? '<button class="btn primary big" id="xRientro" type="button">Rientro</button><button class="btn ghost" id="xDate" type="button">Proroga</button>' : '')
    + '</div>'
    + (n.stato === 'fuori' || n.stato === 'chiuso' ? '<div class="sec"><h2>Foto</h2><div id="fotoBox">' + (fotoCache[n.id] ? '' : '<button class="btn ghost" id="xFoto" type="button">📷 Vedi foto</button>') + '</div></div>' : '')
    + (n.uscita ? '<div class="sec"><h2>Controlli all\'uscita · ' + oraTxt(n.uscita.at) + ' · ' + esc(n.uscita.da) + '</h2>' + (n.uscita.voci || []).map(vv => voceTxt(vv, false)).join('')
      + (n.uscita.note ? '<p class="muted" style="margin:6px 0 0">Nota: ' + esc(n.uscita.note) + '</p>' : '') + '</div>' : '')
    + n.rientri.map(r => '<div class="sec"><h2>Rientro · ' + oraTxt(r.at) + ' · ' + esc(r.da) + '</h2>' + (r.voci || []).map(vv => voceTxt(vv, true)).join('') + '</div>').join('')
    + (n.proroghe.length ? '<div class="sec"><h2>Cambi di data</h2><ul class="list">' + n.proroghe.map(p => '<li><span>' + esc(p.da) + ' · ' + oraTxt(p.at) + '</span><span class="kind">rientro ' + giornoTxt(p.alPrima) + ' → ' + giornoTxt(p.al) + '</span></li>').join('') + '</ul></div>' : '')
    + (isUfficio && /prova/i.test(n.cliente) ? '<div class="actions"><button class="btn danger" id="xDel" type="button">🗑 Elimina noleggio di prova</button></div>' : '')
    + (n.stato === 'annullato' ? '<p class="muted">Annullato da ' + esc(n.annullatoDa || '?') + ' · ' + oraTxt(n.annullatoAt) + '</p>' : '')
    + '<p class="muted small" style="margin:0">Creato da ' + esc(n.creatoDa) + ' · ' + oraTxt(n.creatoAt) + '</p>'
    + '</div>';
  $('xBack').addEventListener('click', chiudiNol);
  v.querySelectorAll('[data-rebuono]').forEach(bb => bb.addEventListener('click', async () => {
    bb.disabled = true; bb.textContent = 'Invio...';
    const nn = findNol(n.id); if(!nn) return;
    const [fase, kk] = bb.dataset.rebuono.split('.');
    let order;
    if(fase === 'uscita') order = buonoUscita(nn, nn.uscita, 0);
    else {
      const k = +kk;
      // righe come erano dopo quel rientro: si ricalcolano dai rientri fino a k
      const righeDopo = nn.righe.map(r => Object.assign({}, r, {rientrati: nn.rientri.slice(0, k).reduce((s, rr) => s + (rr.voci || []).filter(x => x.attrezzoId === r.attrezzoId).reduce((t, x) => t + (x.qty || 0), 0), 0)}));
      order = buonoRientro(nn, nn.rientri[k - 1], k, righeDopo, 0);
    }
    const ok = await inviaBuono(order, n.id);
    if(ok) toast('Buono ' + order.id + ' inviato ✓'); else { bb.disabled = false; bb.textContent = 'Invia di nuovo il buono'; }
  }));
  if($('privLoad')) $('privLoad').addEventListener('click', () => apriDatiPrivato(n));
  const del = $('xDel');
  if(del) del.addEventListener('click', async () => {
    if(del.dataset.armed !== '1'){ del.dataset.armed = '1'; del.textContent = 'Tocca ancora: elimina noleggio, buoni, foto e dati'; del.classList.add('confirm'); return; }
    del.disabled = true; del.textContent = 'Elimino...';
    const ok = await eliminaProva(n);
    if(ok){ toast('Noleggio di prova eliminato ✓'); chiudiNol(); } else { del.disabled = false; del.dataset.armed = ''; del.textContent = '🗑 Elimina noleggio di prova'; del.classList.remove('confirm'); }
  });
  if(fotoCache[n.id]) disegnaFoto(n);
  if($('xFoto')) $('xFoto').addEventListener('click', () => caricaFoto(n));
  if($('xUscita')) $('xUscita').addEventListener('click', () => apriUscita(n.id));
  if($('xRientro')) $('xRientro').addEventListener('click', () => apriRientro(n.id));
  if($('xDate')) $('xDate').addEventListener('click', () => apriDate(n.id));
  const ann = $('xAnn');
  if(ann) ann.addEventListener('click', async () => {
    if(ann.dataset.armed !== '1'){ ann.dataset.armed = '1'; ann.textContent = 'Tocca ancora per annullare'; ann.classList.add('confirm'); return; }
    const err = await txNoleggio(n.id, (raw, nn) => {
      if(nn.stato !== 'prenotato') throw new Error(nn.stato === 'fuori' ? 'gia_uscito' : 'gia_chiuso');
      return {stato: 'annullato', annullatoDa: nomeMio(), annullatoAt: new Date().toISOString()};
    });
    if(err) toast(nolErr(err), true); else toast('Prenotazione annullata');
  });
}

// Solo per i noleggi di prova (cliente con "PROVA"): via buoni, foto, dati privati e noleggio
async function eliminaProva(n){
  try{
    const foto = await getDocs(query(collection(fbDb, 'foto_noleggi'), where('nolId', '==', n.id)));
    await Promise.all(foto.docs.map(d => deleteDoc(d.ref)));
    const ids = [idBuono(n.numero, 'uscita')].concat(n.rientri.map((r, i) => r.buono || idBuono(n.numero, 'rientro', i + 1)));
    await Promise.all(ids.map(id => deleteDoc(doc(fbDb, 'orders', id)).catch(() => {})));
    if(n.tipoCliente === 'privato') await deleteDoc(doc(fbDb, 'clienti_noleggio', n.id)).catch(() => {});
    await deleteDoc(doc(fbDb, 'noleggi', n.id));
    delete fotoCache[n.id];
    return true;
  }catch(e){ toast('Non eliminato: ' + erroreFirebase(e), true); return false; }
}
function buoniHtml(n){
  const lista = [];
  if(n.uscita) lista.push({fase: 'uscita', k: 0, id: n.uscita.buono || idBuono(n.numero, 'uscita'), titolo: 'Uscita', vecchio: !n.uscita.buono});
  n.rientri.forEach((r, i) => lista.push({fase: 'rientro', k: i + 1, id: r.buono || idBuono(n.numero, 'rientro', i + 1), titolo: n.rientri.length > 1 ? 'Rientro ' + (i + 1) : 'Rientro', vecchio: !r.buono}));
  const vis = lista.filter(x => !x.vecchio); // i noleggi fatti prima del passo 4 non hanno buoni automatici
  if(!vis.length) return '';
  return '<div class="sec"><h2>Buoni di carico</h2><ul class="list">' + vis.map(x => buonoInviato(n, x.id)
    ? '<li><span>' + x.titolo + '</span><span class="kind">✓ inviato · ' + esc(x.id) + '</span></li>'
    : '<li class="buono-ko"><span>' + x.titolo + ' · <b>non inviato</b></span><button class="btn dark" type="button" style="margin-left:auto" data-rebuono="' + x.fase + '.' + x.k + '">Invia di nuovo il buono</button></li>').join('') + '</ul></div>';
}

// ---------------- Dati del cliente privato (solo ufficio: raccolta "clienti_noleggio") ----------------
async function salvaDatiPrivato(id, cliente, telefono, documento, note){
  telefono = String(telefono || '').trim(); documento = String(documento || '').trim(); note = String(note || '').trim();
  if(!telefono && !documento && !note) return true;
  try{
    await setDoc(doc(fbDb, 'clienti_noleggio', id), {cliente, telefono, documento, note, aggiornatoDa: nomeMio(), aggiornatoAt: new Date().toISOString()}, {merge: true});
    await updateDoc(doc(fbDb, 'noleggi', id), {datiPrivato: !!(telefono && documento)});
    return true;
  }catch(e){ toast('Dati del privato non salvati: ' + erroreFirebase(e), true); return false; }
}
async function apriDatiPrivato(n){
  const box = $('privBox'); if(!box) return;
  box.innerHTML = '<p class="muted small">Carico…</p>';
  let d = {};
  try{ const snap = await getDoc(doc(fbDb, 'clienti_noleggio', n.id)); if(snap.exists()) d = snap.data(); }
  catch(e){ box.innerHTML = '<p class="muted small">' + esc(erroreFirebase(e)) + '</p>'; return; }
  box.innerHTML = '<div class="row"><div class="field"><label for="pTel">Telefono</label><input class="inp" id="pTel" type="tel" inputmode="tel" maxlength="30" value="' + esc(d.telefono || '') + '"></div>'
    + '<div class="field" style="grid-column:span 2"><label for="pDoc">Documento (tipo e numero)</label><input class="inp" id="pDoc" maxlength="80" placeholder="Es. C.I. CA12345BC" value="' + esc(d.documento || '') + '"></div></div>'
    + '<div class="field"><label for="pNote">Note</label><input class="inp" id="pNote" maxlength="200" value="' + esc(d.note || '') + '"></div>'
    + (d.aggiornatoAt ? '<p class="muted small" style="margin:0">Ultima modifica: ' + esc(d.aggiornatoDa || '') + ' · ' + oraTxt(d.aggiornatoAt) + '</p>' : '')
    + '<div class="actions"><button class="btn primary" id="pSave" type="button">Salva dati</button></div>';
  $('pSave').addEventListener('click', async () => {
    const b = $('pSave'); b.disabled = true; b.textContent = 'Salvo...';
    const ok = await salvaDatiPrivato(n.id, n.cliente, $('pTel').value, $('pDoc').value, $('pNote').value);
    if(ok){ toast(($('pTel').value.trim() && $('pDoc').value.trim()) ? 'Dati salvati ✓' : 'Salvato, ma manca ancora telefono o documento'); }
    b.disabled = false; b.textContent = 'Salva dati';
  });
}

// ---------------- Collegamento a Firebase ----------------
let unsubNol = null;
function avviaNoleggi(){
  if(unsubNol) return;
  unsubNol = onSnapshot(collection(fbDb, 'noleggi'), snap => {
    nolWarnTxt = '';
    noleggi = snap.docs.map(d => normNoleggio(d.id, d.data()));
    aggiornaPallinoNoleggi();
    render();
  }, err => {
    nolWarnTxt = (err && err.code === 'permission-denied')
      ? '⚠️ Firebase non fa leggere i noleggi: vanno aggiornate le regole (raccolta «noleggi»). Riprovo da solo ogni 15 secondi.'
      : '⚠️ Non riesco a leggere i noleggi: controlla la connessione. Riprovo da solo ogni 15 secondi.';
    noleggi = []; render();
    // la lettura si è fermata: si riprova da soli, così non restano dati vecchi sullo schermo
    unsubNol = null;
    setTimeout(avviaNoleggi, 15000);
  });
}

// =====================================================================
// PASSO 3 — FOTO in uscita e al rientro (Firestore, 15 giorni dal rientro)
// =====================================================================
const FOTO_GIORNI = 15;
const FOTO_MS = FOTO_GIORNI * 86400000;
const fotoCache = {};   // nolId -> [foto] già caricate
let fotoAperte = {};    // nolId -> true se l'utente ha toccato "Vedi foto"

// Riduce la foto sul tablet: lato lungo 1280 px, JPEG, sotto ~600 KB di testo
function comprimiFoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const max = 1280;
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = 0.6, d = c.toDataURL('image/jpeg', q);
      while(d.length > 600000 && q > 0.3){ q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      if(d.length > 900000){ rej(new Error('troppo_grande')); return; }
      res({dataUrl: d, w, h});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('non_immagine')); };
    img.src = url;
  });
}
function fotoRowHtml(i){
  const v = F.voci[i];
  return '<div class="ctrl"><div class="ctrl-t">Foto <span class="muted">(facoltative, si cancellano ' + FOTO_GIORNI + ' giorni dopo il rientro)</span></div>'
    + '<div class="foto-row" data-fr="' + i + '">' + fotoThumbs(i) + '</div></div>';
}
function fotoThumbs(i){
  const v = F.voci[i];
  return (v.foto || []).map((f, k) => '<div class="thumb"><img src="' + f.dataUrl + '" alt="Foto ' + (k + 1) + '"><button type="button" class="thumb-x" data-fx="' + i + '.' + k + '" aria-label="Togli foto">✕</button></div>').join('')
    + '<label class="foto-add">📷 Aggiungi foto<input type="file" accept="image/*" multiple data-fa="' + i + '" hidden></label>';
}
function wireFoto(box){
  box.querySelectorAll('[data-fa]').forEach(inp => inp.addEventListener('change', async () => {
    const i = +inp.dataset.fa, files = [...inp.files];
    if(!files.length) return;
    const row = box.querySelector('[data-fr="' + i + '"]');
    row.insertAdjacentHTML('beforeend', '<span class="muted small" data-fwait>Preparo la foto…</span>');
    for(const file of files){
      try{ const f = await comprimiFoto(file); (F.voci[i].foto = F.voci[i].foto || []).push(f); }
      catch(e){ toast(e.message === 'non_immagine' ? 'Questo file non è una foto.' : 'Foto troppo pesante, riprova.', true); }
    }
    row.innerHTML = fotoThumbs(i); wireFoto(row);
  }));
  box.querySelectorAll('[data-fx]').forEach(b => b.addEventListener('click', () => {
    const [i, k] = b.dataset.fx.split('.').map(Number);
    F.voci[i].foto.splice(k, 1);
    const row = box.querySelector('[data-fr="' + i + '"]');
    row.innerHTML = fotoThumbs(i); wireFoto(row);
  }));
}
// Salva le foto del modulo aperto; ritorna quante non sono andate
async function salvaFoto(nolId, numero, fase, voci, now){
  let ko = 0;
  for(const v of voci){
    for(const f of (v.foto || [])){
      try{
        await addDoc(collection(fbDb, 'foto_noleggi'), {
          nolId, numero, fase, attrezzoId: v.attrezzoId, attrezzo: v.nome,
          dataUrl: f.dataUrl, w: f.w, h: f.h, at: now, da: nomeMio(), daEmail: me, nolChiusoMs: null
        });
      }catch(e){ ko++; }
    }
  }
  delete fotoCache[nolId];
  if(ko) toast(ko + (ko === 1 ? ' foto non salvata' : ' foto non salvate') + ': controlla la connessione. Il resto è salvato.', true);
  return ko;
}
// Quando il noleggio si chiude, le sue foto prendono la data da cui contano i 15 giorni
async function segnaFotoChiuse(nolId, quandoMs){
  try{
    const snap = await getDocs(query(collection(fbDb, 'foto_noleggi'), where('nolId', '==', nolId)));
    await Promise.all(snap.docs.map(d => updateDoc(d.ref, {nolChiusoMs: quandoMs})));
  }catch(e){}
}
// Cancella le foto dei noleggi chiusi da più di 15 giorni (le regole non permettono prima)
async function pulisciFotoVecchie(){
  try{
    const snap = await getDocs(query(collection(fbDb, 'foto_noleggi'), where('nolChiusoMs', '<', Date.now() - FOTO_MS - 3600000), limit(50)));
    await Promise.all(snap.docs.map(d => deleteDoc(d.ref).catch(() => {})));
  }catch(e){}
}
async function caricaFoto(n){
  const box = $('fotoBox'); if(!box) return;
  if(!fotoCache[n.id]){
    box.innerHTML = '<p class="muted small">Carico le foto…</p>';
    try{
      const snap = await getDocs(query(collection(fbDb, 'foto_noleggi'), where('nolId', '==', n.id)));
      fotoCache[n.id] = snap.docs.map(d => d.data()).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    }catch(e){ box.innerHTML = '<p class="muted small">' + esc(erroreFirebase(e)) + '</p>'; return; }
  }
  disegnaFoto(n);
}
function disegnaFoto(n){
  const box = $('fotoBox'); if(!box) return;
  const lista = fotoCache[n.id] || [];
  if(!lista.length){ box.innerHTML = '<p class="muted small">Nessuna foto per questo noleggio.</p>'; return; }
  const gruppi = [['uscita', 'All\'uscita'], ['rientro', 'Al rientro']];
  box.innerHTML = gruppi.map(([f, t]) => {
    const g = lista.filter(x => x.fase === f); if(!g.length) return '';
    return '<div class="lbl" style="margin:6px 0">' + t + '</div><div class="foto-row">' + g.map(x => {
      const k = lista.indexOf(x);
      return '<button type="button" class="thumb big" data-fo="' + k + '"><img src="' + x.dataUrl + '" alt="Foto ' + esc(x.attrezzo) + '"><span>' + esc(x.attrezzo) + ' · ' + oraTxt(x.at) + '</span></button>';
    }).join('') + '</div>';
  }).join('') + (n.chiusoAt ? '<p class="muted small" style="margin-top:8px">Si cancellano dal ' + giornoTxt(addGiorni(n.chiusoAt.slice(0, 10), FOTO_GIORNI)) + '. Se ti serve una foto, aprila e salvala sul dispositivo.</p>' : '');
  box.querySelectorAll('[data-fo]').forEach(b => b.addEventListener('click', () => apriFoto(lista[+b.dataset.fo], n)));
}
function apriFoto(x, n){
  const ov = $('fotoOverlay');
  ov.innerHTML = '<div class="fo-in"><img src="' + x.dataUrl + '" alt="Foto ' + esc(x.attrezzo) + '">'
    + '<div class="fo-bar"><span>' + esc(x.attrezzo) + ' · ' + (x.fase === 'uscita' ? 'uscita' : 'rientro') + ' · ' + oraTxt(x.at) + ' · ' + esc(x.da) + '</span>'
    + '<a class="btn primary" download="noleggio-' + esc(n.numero) + '-' + esc(x.fase) + '-' + String(x.at).slice(0, 16).replace(/[:T]/g, '') + '.jpg" href="' + x.dataUrl + '">Salva sul dispositivo</a>'
    + '<button class="btn ghost" type="button" id="foClose">Chiudi</button></div></div>';
  ov.hidden = false;
  $('foClose').addEventListener('click', () => { ov.hidden = true; ov.innerHTML = ''; });
}
